name: package-smoke

on:
  workflow_dispatch:

jobs:
  windows-package-smoke:
    runs-on: windows-latest

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pyright

      - name: Build legacy payload
        run: |
          python scripts/build_legacy_payload.py --src smartclipboard_app/legacy_main_src.py --out smartclipboard_app/legacy_main_payload.marshal --smoke-import

      - name: Run preflight checks
        run: |
          python scripts/preflight_local.py --skip-payload-build --strict-optional-deps --with-pyright

      - name: Build frozen package
        run: |
          pyinstaller --clean smartclipboard.spec

      - name: Smoke frozen executable startup
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\SmartClipboard.exe"
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath $exe -ArgumentList "--minimized" -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) {
            throw "SmartClipboard.exe exited early with code $($process.ExitCode)"
          }
          if (-not $process.HasExited) {
            Stop-Process -Id $process.Id -Force
          }
